<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunset & Twilight by Location</title>
    <link rel="stylesheet" href="style_suntime.css" />
  </head>
  <body>
    <main class="sunset-page">
      <section class="sunset-card">
        <h1 class="sunset-title">Today’s Sunset & Twilight</h1>
        <p class="sunset-subtitle">
          This page uses your current location to calculate sunset and
          astronomical twilight times.
        </p>

        <div class="sunset-result-grid">
          <div class="sunset-result">
            <div class="sunset-meta">Today’s Sunset</div>
            <span id="sunset-time" class="sunset-time">--:--</span>
            <div id="sunset-date" class="sunset-meta">Waiting for location…</div>
            <div id="sunset-remaining" class="sunset-meta"></div>
          </div>
          <div class="sunset-result">
            <div class="sunset-meta">Today’s Twilight</div>
            <span id="twilight-time" class="sunset-time">--:--</span>
            <div class="sunset-meta">Astronomical twilight begin</div>
            <div id="twilight-remaining" class="sunset-meta"></div>
          </div>
        </div>

        <div class="sunset-actions">
          <button id="refresh-btn" class="sunset-btn" type="button">
            Refresh Times
          </button>
        </div>

        <p id="sunset-status" class="sunset-status"></p>
      </section>
    </main>

    <script>
      const sunsetTimeEl = document.getElementById("sunset-time");
      const twilightTimeEl = document.getElementById("twilight-time");
      const sunsetDateEl = document.getElementById("sunset-date");
      const sunsetRemainingEl = document.getElementById("sunset-remaining");
      const twilightRemainingEl = document.getElementById("twilight-remaining");
      const sunsetStatusEl = document.getElementById("sunset-status");
      const refreshBtn = document.getElementById("refresh-btn");

      let activeSunsetDate = null;
      let activeTwilightDate = null;
      let remainingTimer = null;

      function setStatus(message) {
        sunsetStatusEl.textContent = message;
      }

      function formatRemaining(diffMs) {
        if (diffMs <= 0) {
          return null;
        }

        const totalSeconds = Math.floor(diffMs / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        return `${hours}h ${minutes}m ${seconds}s`;
      }

      function updateRemainingTime() {
        const now = new Date();

        if (activeSunsetDate) {
          const sunsetRemaining = formatRemaining(activeSunsetDate.getTime() - now.getTime());
          sunsetRemainingEl.textContent = sunsetRemaining
            ? `Sunset remaining: ${sunsetRemaining}`
            : "Sunset has already passed for today.";
        } else {
          sunsetRemainingEl.textContent = "";
        }

        if (activeTwilightDate) {
          const twilightRemaining = formatRemaining(activeTwilightDate.getTime() - now.getTime());
          twilightRemainingEl.textContent = twilightRemaining
            ? `Twilight remaining: ${twilightRemaining}`
            : "Twilight has already passed for today.";
        } else {
          twilightRemainingEl.textContent = "";
        }
      }

      async function loadSunset(latitude, longitude) {
        const endpoint = `https://api.sunrise-sunset.org/json?lat=${latitude}&lng=${longitude}&date=today&formatted=0`;
        const response = await fetch(endpoint);

        if (!response.ok) {
          throw new Error("Failed to fetch sunset data.");
        }

        const payload = await response.json();
        if (payload.status !== "OK") {
          throw new Error("Sunset API returned an invalid response.");
        }

        const sunsetDate = new Date(payload.results.sunset);
        activeSunsetDate = sunsetDate;
        const localTime = sunsetDate.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
        const readableDate = sunsetDate.toLocaleDateString([], {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
        });
        const twilightDate = new Date(payload.results.astronomical_twilight_begin);
        activeTwilightDate = twilightDate;
        const twilightTime = twilightDate.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });

        sunsetTimeEl.textContent = localTime;
        twilightTimeEl.textContent = twilightTime;
        sunsetDateEl.textContent = readableDate;
        updateRemainingTime();

        if (remainingTimer) {
          clearInterval(remainingTimer);
        }
        remainingTimer = setInterval(updateRemainingTime, 1000);
        setStatus("Updated successfully.");
      }

      function fetchSunsetForCurrentLocation() {
        if (!navigator.geolocation) {
          setStatus("Geolocation is not supported by your browser.");
          sunsetDateEl.textContent = "Cannot detect location.";
          return;
        }

        setStatus("Detecting your location...");
        navigator.geolocation.getCurrentPosition(
          async (position) => {
            try {
              setStatus("Calculating today’s sunset...");
              await loadSunset(
                position.coords.latitude,
                position.coords.longitude,
              );
            } catch (error) {
              setStatus(error.message || "Unable to calculate sunset.");
            }
          },
          (error) => {
            const message =
              error.code === error.PERMISSION_DENIED
                ? "Location permission was denied. Please allow location access and refresh."
                : "Could not get your location. Please try again.";
            setStatus(message);
            sunsetDateEl.textContent = "Location unavailable.";
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 300000,
          },
        );
      }

      refreshBtn.addEventListener("click", fetchSunsetForCurrentLocation);
      fetchSunsetForCurrentLocation();
    </script>
  </body>
</html>
